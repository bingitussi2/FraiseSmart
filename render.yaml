databases:
  - name: kivusense-postgres
    databaseName: kivusense
    user: kivusense
    plan: free

services:
  - type: web
    name: kivusense-api
    runtime: python
    plan: free
    buildCommand: pip install -r Fraisebackend/requirements.txt
    startCommand: uvicorn Fraisebackend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kivusense-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.7

  - type: web
    name: kivusense-web
    runtime: static
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
